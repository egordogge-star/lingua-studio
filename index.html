dden=true;location.hash='booking'}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const r=document.getElementById('result');r.textContent=(current?'Aperçu : ':'Preview: ')+['language','focus','plan'].map(id=>{const s=document.getElementById(id);return s.options[s.selectedIndex].textContent}).join(' · ')+(current?' — Aucune réservation effectuée.':' — No booking was made.');r.hidden=false});document.getElementById("en").addEventListener("click",()=>setLanguage(0));document.getElementById("fr").addEventListener("click",()=>setLanguage(1));document.getElementById("form").addEventListener("change",()=>document.getElementById("result").hidden=true);setLanguage(0);</script></body></html>
